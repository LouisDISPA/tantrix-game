name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Format, lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      # Official Dioxus CI building blocks, pinned to v0.1.0. The toolchain
      # matches rust-toolchain.toml.
      - uses: DioxusLabs/dioxus-ci/actions/setup-dioxus@68b5983fd6c83a02ed52638fe5063678ce8ad09c # v0.1.0
        with:
          toolchain: nightly
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: just fmt-check
      - run: just lint
      - run: just test

  e2e:
    name: Browser tests (Cloudflare Worker)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DioxusLabs/dioxus-ci/actions/setup-dioxus@68b5983fd6c83a02ed52638fe5063678ce8ad09c # v0.1.0
        with:
          toolchain: nightly
          targets: wasm32-unknown-unknown
          # `just worker-ssr` installs worker-build here.
          cache-directories: target/tools
      # Prebuilt `dx` through cargo-binstall instead of compiling it. Keep the
      # version in step with the dioxus crates in Cargo.lock.
      - uses: DioxusLabs/dioxus-ci/actions/install-dioxus-cli@68b5983fd6c83a02ed52638fe5063678ce8ad09c # v0.1.0
        with:
          version: 0.7.10
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            e2e/package-lock.json
            cloudflare/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # Builds the client and the SSR module, installs the pinned Wrangler,
      # then runs the suite against `wrangler dev`.
      - run: just worker-e2e
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
