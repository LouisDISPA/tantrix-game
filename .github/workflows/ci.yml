name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Release runs CI on the tagged commit before it builds anything.
  workflow_call:

concurrency:
  # Called from Release, `github.workflow` is the caller's name, which keeps
  # this group apart from a CI run on the same ref.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - run: rustup toolchain install --no-self-update

      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          cache-all-crates: true
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Format check
        run: just fmt-check

      - name: Lint check
        run: just lint

      - name: Unit tests
        run: just test

  e2e:
    name: Browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          cache-all-crates: true
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: DioxusLabs/dioxus-ci/actions/install-dioxus-cli@68b5983fd6c83a02ed52638fe5063678ce8ad09c # v0.1.0
        with:
          version: '0.8.0-alpha.3'

      # Playwright's server command reuses this release build.
      - name: Build the app
        run: 'dx build --locked --release --package tantrix-app --web --fullstack true --features fullstack'

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12.8.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml

      - name: Install Playwright
        working-directory: e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: E2E tests (native server)
        working-directory: e2e
        run: pnpm run test:native

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
