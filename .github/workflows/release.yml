name: Release

on:
  push:
    tags:
      - 'tantrix-app-v*'
  # Build without publishing; run on the default branch to warm caches for tags.
  workflow_dispatch:
    inputs:
      macos_only:
        description: Build only the macOS x86_64 bundle for signing diagnostics
        type: boolean
        default: false
      windows_only:
        description: Build only the Windows x86_64 bundle for signing diagnostics
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: stable
  DIOXUS_CLI_VERSION: '0.8.0-alpha.3'
  VELOPACK_VERSION: '1.2.161'

jobs:
  build:
    name: Bundle ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: >-
        ${{ fromJSON(inputs.macos_only && '{"include":[{"runner":"macos-15-intel","platform":"macos","arch":"x86_64","target":"x86_64-apple-darwin","packages":"--package-types macos"}]}' || inputs.windows_only && '{"include":[{"runner":"windows-2022","platform":"windows","arch":"x86_64","target":"x86_64-pc-windows-msvc"}]}' ||
          '{"include":[{"runner":"macos-14","platform":"macos","arch":"aarch64","target":"aarch64-apple-darwin","packages":"--package-types macos"},
            {"runner":"macos-15-intel","platform":"macos","arch":"x86_64","target":"x86_64-apple-darwin","packages":"--package-types macos"},
            {"runner":"ubuntu-24.04","platform":"linux","arch":"x86_64","target":"x86_64-unknown-linux-gnu","packages":"--package-types deb"},
            {"runner":"ubuntu-24.04-arm","platform":"linux","arch":"aarch64","target":"aarch64-unknown-linux-gnu","packages":"--package-types deb"},
            {"runner":"windows-2022","platform":"windows","arch":"x86_64","target":"x86_64-pc-windows-msvc"},
            {"runner":"windows-11-arm","platform":"windows","arch":"aarch64","target":"aarch64-pc-windows-msvc"}]}') }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Validate release version
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          metadata = json.loads(subprocess.check_output([
              "cargo", "metadata", "--locked", "--no-deps", "--format-version", "1",
          ]))
          version = next(p["version"] for p in metadata["packages"] if p["name"] == "tantrix-app")
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              assert os.environ["GITHUB_REF_NAME"] == f"tantrix-app-v{version}", "Tag must match tantrix-app's version"
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"VERSION={version}\n")
          PY

      - name: Test signing configuration
        run: python3 -B -m unittest discover -s scripts -p 'test_pack_desktop.py'

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          key: desktop-${{ matrix.runner }}-dx-${{ env.DIOXUS_CLI_VERSION }}
          cache-bin: false

      - name: Cache Dioxus CLI
        id: dx-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/dx${{ runner.os == 'Windows' && '.exe' || '' }}
          key: dx-${{ matrix.runner }}-${{ env.DIOXUS_CLI_VERSION }}

      - name: Install Dioxus CLI
        if: steps.dx-cache.outputs.cache-hit != 'true'
        uses: DioxusLabs/dioxus-ci/actions/install-dioxus-cli@68b5983fd6c83a02ed52638fe5063678ce8ad09c # v0.1.0
        with:
          version: ${{ env.DIOXUS_CLI_VERSION }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Install Velopack
        run: dotnet tool install -g vpk --version "$VELOPACK_VERSION"

      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf dpkg-dev gstreamer1.0-plugins-base

      - name: Build desktop bundles
        if: runner.os != 'Windows'
        run: dx bundle --locked --release --platform ${{ matrix.platform }} --target ${{ matrix.target }} --package tantrix-app --features desktop,bundle ${{ matrix.packages }} --out-dir bundles

      - name: Build Windows payload
        if: runner.os == 'Windows'
        run: dx build --locked --release --platform windows --target ${{ matrix.target }} --package tantrix-app --features desktop,bundle

      - name: Package updates and downloads
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
          LINUX_GPG_FINGERPRINT: ${{ vars.LINUX_GPG_FINGERPRINT }}
        run: python3 scripts/pack-desktop.py ${{ matrix.platform }} ${{ matrix.arch }} "$VERSION"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0

  android:
    name: Bundle Android ARM64
    if: ${{ !inputs.macos_only && !inputs.windows_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-10-18
      ANDROID_NDK_VERSION: '28.2.13676358'
      GRADLE_OPTS: -Dorg.gradle.caching=true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-10-18
          targets: aarch64-linux-android
          components: rust-src
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          # Release tags should also save caches for reruns of the same tag.
          cache-read-only: false
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          key: android-dx-${{ env.DIOXUS_CLI_VERSION }}-ndk-${{ env.ANDROID_NDK_VERSION }}
          cache-bin: false
          cache-on-failure: true
      - name: Cache Dioxus CLI
        id: dx-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/dx
          key: dx-${{ runner.os }}-${{ runner.arch }}-${{ env.DIOXUS_CLI_VERSION }}
      - name: Install Dioxus CLI
        if: steps.dx-cache.outputs.cache-hit != 'true'
        uses: DioxusLabs/dioxus-ci/actions/install-dioxus-cli@68b5983fd6c83a02ed52638fe5063678ce8ad09c # v0.1.0
        with:
          version: ${{ env.DIOXUS_CLI_VERSION }}
      - name: Build and verify signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python3 scripts/pack-android.py
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: android-aarch64
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub release
    needs: [build, android]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release and upload downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#tantrix-app-v}"
          flags=()
          if [[ "$version" == *-* ]]; then
            flags+=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/* --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/* --verify-tag --generate-notes --title "Tantrix $version" "${flags[@]}"
          fi
