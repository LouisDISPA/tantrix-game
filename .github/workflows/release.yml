name: Release

on:
  push:
    tags:
      - 'tantrix-app-v*'
  # Build without publishing; run on the default branch to warm caches for tags.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: stable
  DIOXUS_CLI_VERSION: '0.7.10'

jobs:
  build:
    name: Bundle ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: macos
            arch: aarch64
            target: aarch64-apple-darwin
            packages: --package-types macos --package-types dmg
          - runner: macos-15-intel
            platform: macos
            arch: x86_64
            target: x86_64-apple-darwin
            packages: --package-types macos --package-types dmg
          - runner: ubuntu-24.04
            platform: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            packages: --package-types deb
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            target: aarch64-unknown-linux-gnu
            packages: --package-types deb
          - runner: windows-2022
            platform: windows
            arch: x86_64
            target: x86_64-pc-windows-msvc
            packages: --package-types nsis
          - runner: windows-11-arm
            platform: windows
            arch: aarch64
            target: aarch64-pc-windows-msvc
            packages: --package-types nsis
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Validate release version
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          metadata = json.loads(subprocess.check_output([
              "cargo", "metadata", "--locked", "--no-deps", "--format-version", "1",
          ]))
          version = next(p["version"] for p in metadata["packages"] if p["name"] == "tantrix-app")
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              assert os.environ["GITHUB_REF_NAME"] == f"tantrix-app-v{version}", "Tag must match tantrix-app's version"
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"VERSION={version}\n")
          PY

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          key: desktop-${{ matrix.runner }}-dx-${{ env.DIOXUS_CLI_VERSION }}
          cache-bin: false

      - name: Cache Dioxus CLI
        id: dx-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/dx${{ runner.os == 'Windows' && '.exe' || '' }}
          key: dx-${{ matrix.runner }}-${{ env.DIOXUS_CLI_VERSION }}

      - name: Install Dioxus CLI
        if: steps.dx-cache.outputs.cache-hit != 'true'
        uses: DioxusLabs/dioxus-ci/actions/install-dioxus-cli@68b5983fd6c83a02ed52638fe5063678ce8ad09c # v0.1.0
        with:
          version: ${{ env.DIOXUS_CLI_VERSION }}

      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev dpkg-dev gstreamer1.0-plugins-base

      - name: Build desktop bundles
        run: dx bundle --locked --release --platform ${{ matrix.platform }} --target ${{ matrix.target }} --package tantrix-app --features desktop,bundle ${{ matrix.packages }} --out-dir bundles

      - name: Bundle AppImage runtime dependencies
        if: runner.os == 'Linux'
        run: bash scripts/bundle-appimage.sh bundles/*.deb

      - name: Stage downloads
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import shutil

          platform = os.environ["PLATFORM"]
          prefix = f"Tantrix-{os.environ['VERSION']}-{platform}-{os.environ['ARCH']}"
          downloads = Path("artifacts")
          downloads.mkdir()
          extensions = {"macos": ["dmg"], "linux": ["deb", "AppImage"], "windows": ["exe"]}
          for extension in extensions[platform]:
              matches = [p for p in Path("bundles").iterdir() if p.is_file() and p.suffix.lower() == f".{extension.lower()}"]
              if len(matches) != 1:
                  raise RuntimeError(f"Expected one {extension} bundle, found {matches}")
              name = f"{prefix}-setup.exe" if platform == "windows" else f"{prefix}.{extension}"
              shutil.move(matches[0], downloads / name)
          if platform == "windows":
              shutil.copyfile("target/dx/tantrix/release/windows/app/tantrix.exe", downloads / f"{prefix}-portable.exe")
          PY

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub release
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: artifacts
          merge-multiple: true

      - name: Create release and upload downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#tantrix-app-v}"
          flags=()
          if [[ "$version" == *-* ]]; then
            flags+=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/* --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/* --verify-tag --generate-notes --title "Tantrix $version" "${flags[@]}"
          fi
