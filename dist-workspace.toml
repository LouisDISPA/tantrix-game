[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# Large Rust workspaces should opt binaries into distribution individually.
dist = false
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# dx must bundle native assets on each platform runner. The Windows executable and installer
# are produced by the Dioxus workflow so Windows users only get the requested formats.
source-tarball = false
post-announce-jobs = ["./desktop-packaging"]
# Where to host releases
hosting = "github"

[dist.dependencies.apt]
"libwebkit2gtk-4.1-dev" = { targets = ["x86_64-unknown-linux-gnu"] }
libgtk-3-dev = { targets = ["x86_64-unknown-linux-gnu"] }
libayatana-appindicator3-dev = { targets = ["x86_64-unknown-linux-gnu"] }
librsvg2-dev = { targets = ["x86_64-unknown-linux-gnu"] }
patchelf = { targets = ["x86_64-unknown-linux-gnu"] }
libxdo-dev = { targets = ["x86_64-unknown-linux-gnu"] }
