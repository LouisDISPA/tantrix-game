[package]
name = "tantrix-room"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
tantrix-game.workspace = true
tantrix-proto.workspace = true
enum-map = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
uuid = { workspace = true, features = ["v4", "v5", "js"] }
getrandom = { workspace = true, features = ["wasm_js"] }
# Online deals are shuffled by the OS-seeded thread RNG (ChaCha12).
rand.workspace = true

[dev-dependencies]
serde_json.workspace = true
futures.workspace = true
