[package]
license = "MIT"
name = "tantrix-room"
version = "0.1.0"
edition = "2021"

[dependencies]
tantrix-game = { path = "../tantrix-game" }
tantrix-proto = { path = "../tantrix-proto" }
enum-map = { version = "3.1.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
uuid = { version = "1", features = ["v4", "v5", "js"] }
getrandom = { version = "0.4.3", features = ["wasm_js"] }
# Online deals are shuffled by the OS-seeded thread RNG (ChaCha12).
rand = "0.10.3"

[dev-dependencies]
serde_json = "1.0.151"
futures = "0.3.34"
