[workspace]
members = [
    "tantrix-game",
    "tantrix-ai",
    "tantrix-tui",
    "tantrix-app",
    "tantrix-tournament",
    "tantrix-proto",
    "tantrix-room",
    "tantrix-net",
    "tantrix-worker",
]
resolver = "2"

# No `rust-version`: rust-toolchain.toml pins a dated nightly, so an MSRV would
# be untested.
[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/LouisDISPA/tantrix-game"

# Dependencies of two or more members. Entries pin the version and, where a
# member needs them off, default features; members list their own features.
[workspace.dependencies]
tantrix-ai = { path = "tantrix-ai" }
tantrix-game = { path = "tantrix-game" }
tantrix-proto = { path = "tantrix-proto" }
tantrix-room = { path = "tantrix-room" }

axum = { version = "0.8.9", default-features = false }
crossterm = "0.29.0"
enum-iterator = "2.3.0"
enum-map = "3.1.0"
futures = "0.3.34"
futures-channel = "0.3.34"
getrandom = "0.4.3"
log = "0.4.34"
rand = "0.10.3"
ratatui = "0.30.2"
reqwest = { version = "0.13", default-features = false }
serde = "1.0.229"
serde_json = "1.0.151"
tokio = "1.53.1"
tokio-tungstenite = { version = "0.29.0", default-features = false }
uuid = "1"
wasm-bindgen = "0.2.129"
web-sys = "0.3.106"
web-time = "1"

# Every member sets `[lints] workspace = true`. Clippy keeps its default lints
# (plus clippy.toml). The library crates also `#![warn(missing_docs)]`.
[workspace.lints.rust]
# `pub` only on items other crates can reach; everything else is `pub(crate)`
# or narrower, so unused items surface as dead code.
unreachable_pub = "warn"

# Vendored dioxus-server 0.8.0-alpha.3 adds wasm32 support for Cloudflare SSR.
[patch.crates-io]
dioxus-server = { path = "vendor/dioxus-server" }

# Size-optimized wasm. `dx build --web --release` builds the client with this
# profile by name, and the Worker build recipes use it for the SSR module.
# Native binaries keep the default release profile: the server unwinds a
# panicking room task instead of aborting every room, and the tournament
# stays optimized for speed. The Worker client build also rebuilds std for the
# browser client (see the justfile). No `strip`: `dx tools assets` reads the Worker
# module's symbols (dx forces `strip=false` on its own builds for the same
# reason).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
