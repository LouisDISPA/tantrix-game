[package]
name = "tantrix-app"
version = "0.1.0"
edition = "2021"

[dependencies]
tantrix-game = { path = "../tantrix-game" }
tantrix-ai = { path = "../tantrix-ai" }
tantrix-proto = { path = "../tantrix-proto" }
tantrix-net = { path = "../tantrix-net" }
dioxus = { version = "0.7", features = ["router"] }
rand = "0.10"
tokio = { version = "1", default-features = false, features = ["time"], optional = true }
gloo-timers = { version = "0.3", features = ["futures"], optional = true }
getrandom = { version = "0.4", features = ["wasm_js"] }
futures = "0.3"
futures-channel = "0.3"
web-sys = { version = "0.3", features = ["Window", "Location", "Navigator", "Clipboard"] }
wasm-bindgen-futures = "0.4"

[features]
default = ["web"]
web = ["dioxus/web", "dep:gloo-timers"]
desktop = ["dioxus/desktop", "dep:tokio"]
native = ["dioxus/native", "dep:tokio"]
mobile = ["dioxus/mobile", "dep:tokio"]

# Cargo.toml
[profile.release]
opt-level = "z" # Optimize for size
lto = true
codegen-units = 1
panic = "abort"
strip = true
