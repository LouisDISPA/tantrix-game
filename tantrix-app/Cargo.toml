[package]
license = "MIT"
name = "tantrix-app"
version = "0.1.4"
edition = "2021"
description = "A cross-platform implementation of the Tantrix hex tile strategy game"
repository = "https://github.com/LouisDISPA/tantrix-game"

[[bin]]
name = "tantrix"
path = "src/main.rs"

[dependencies]
tantrix-game = { path = "../tantrix-game" }
tantrix-ai = { path = "../tantrix-ai" }
tantrix-proto = { path = "../tantrix-proto" }
tantrix-room = { path = "../tantrix-room", optional = true }
tantrix-net = { path = "../tantrix-net" }
# Without `devtools` (hot-reload client) and `logger` (tracing subscriber), which
# are on by default and weigh 93 kB of release wasm. `just dev` re-enables both
# through the `devtools` feature below.
dioxus = { version = "=0.8.0-alpha.3", default-features = false, features = ["router", "launch", "lib"] }
dioxus-fullstack-core = { version = "=0.8.0-alpha.3", optional = true }
http = { version = "1.3.1", optional = true }
tokio = { version = "1.53.1", default-features = false, features = ["time"], optional = true }
gloo-timers = { version = "0.4.0", features = ["futures"], optional = true }
getrandom = { version = "0.4.3", features = ["wasm_js"] }
futures = "0.3.34"
futures-channel = "0.3.34"
# The timer of builds without a platform feature (see `util::sleep`); the
# browser transport (tantrix-net) depends on it anyway.
futures-timer = "3.0.4"
log = "0.4.34"

# Server-only: Axum serves the native fullstack app and online rooms.
axum = { version = "0.8.9", features = ["ws"], optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"], optional = true }
rusqlite = { version = "0.37.0", features = ["bundled"], optional = true }
serde_json = { version = "1.0.151", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = { version = "6", optional = true }
url = { version = "2", optional = true }
arboard = { version = "3", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["native-tls"], optional = true }
velopack = { version = "=1.2.161", optional = true }

tower-http = { version = "0.6.11", default-features = false, features = ["compression-br", "compression-gzip"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3.106", features = ["Element", "Window", "Location", "Navigator", "Clipboard", "Storage", "console"] }
js-sys = { version = "0.3.106", optional = true }
wasm-bindgen = { version = "0.2.129", optional = true }
wasm-bindgen-futures = "0.4.79"

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3"

[features]
default = []
# Hot reload and dioxus's tracing output, for `dx serve`; left out of release bundles.
devtools = ["dioxus/devtools", "dioxus/logger"]
web = ["dioxus/web", "dep:gloo-timers", "dep:js-sys", "dep:wasm-bindgen", "web-sys/Event", "web-sys/EventTarget", "web-sys/Request", "web-sys/RequestInit", "web-sys/Response", "web-sys/Headers", "web-sys/AbortSignal", "web-sys/MediaQueryList"]
server = [
    "dioxus/server",
    "dep:dioxus-fullstack-core",
    "dep:http",
    "dep:tokio",
    "tokio/macros",
    "tokio/rt-multi-thread",
    "dep:axum",
    "dep:tantrix-room",
    "dep:rusqlite",
    "dep:serde_json",
    "tokio/net",
    "tokio/sync",
    "dep:tracing-subscriber",
    "dep:tower-http",
]
fullstack = ["dioxus/fullstack"]
# Server-side rendering inside a Cloudflare Worker (see `tantrix-worker`).
# The app uses browser-style timers and the SSR response status context there;
# the SSR host lives in the worker crate.
worker = ["dep:gloo-timers", "dep:dioxus-fullstack-core", "dep:http"]
liveview = ["dioxus/liveview"]
desktop = ["dioxus/desktop", "dep:tokio", "tantrix-net/native", "dep:dirs", "dep:url", "dep:arboard", "dep:reqwest", "dep:velopack"]
bundle = []
native = ["dioxus/native", "dep:tokio"]
mobile = ["dioxus/mobile", "dep:tokio"]
