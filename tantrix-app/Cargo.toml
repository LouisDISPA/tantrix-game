[package]
name = "tantrix-app"
version = "0.2.0"
description = "A cross-platform implementation of the Tantrix hex tile strategy game"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "tantrix"
path = "src/main.rs"

[dependencies]
tantrix-game.workspace = true
tantrix-ai.workspace = true
tantrix-proto.workspace = true
tantrix-room = { workspace = true, optional = true }
tantrix-net = { path = "../tantrix-net" }
# Without `devtools` (hot-reload client) and `logger` (tracing subscriber), which
# are on by default and weigh 93 kB of release wasm. `just dev` re-enables both
# through the `devtools` feature below.
dioxus = { version = "=0.8.0-alpha.3", default-features = false, features = ["router", "launch", "lib"] }
dioxus-fullstack-core = { version = "=0.8.0-alpha.3", optional = true }
http = { version = "1.3.1", optional = true }
tokio = { workspace = true, features = ["time"], optional = true }
gloo-timers = { version = "0.4.0", features = ["futures"], optional = true }
getrandom = { workspace = true, features = ["wasm_js"] }
futures.workspace = true
futures-channel.workspace = true
web-time.workspace = true
log.workspace = true
semver = "1"
url = "2"
serde_json.workspace = true

# Server-only: Axum serves the native fullstack app and online rooms.
axum = { workspace = true, default-features = true, features = ["ws"], optional = true }
# Server logs: room and socket spans, compact or JSON lines (see doc/MULTIPLAYER.md).
tracing = { version = "0.1.44", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"], optional = true }
rusqlite = { version = "0.37.0", features = ["bundled"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = { version = "3", optional = true }
velopack = { version = "=1.2.161", optional = true }

tower-http = { version = "0.6.11", default-features = false, features = ["compression-br", "compression-gzip"], optional = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
# Android keeps its settings in the app's files directory instead.
dirs = { version = "7", optional = true }
reqwest = { workspace = true, features = ["native-tls"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
# Android does not ship an OpenSSL development library; bundle Rustls roots.
# Stays on 0.12: 0.13's Rustls backend verifies through the Android platform
# verifier, which needs JNI initialisation and its Kotlin classes in the APK.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
jni = { version = "=0.21.1", optional = true }
ndk-context = { version = "=0.1.1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = ["Element", "Window", "Location", "Navigator", "Clipboard", "Storage", "console"] }
js-sys = { version = "0.3.106", optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = "0.4.79"

[build-dependencies]
# Names the repeated platform predicates; see build.rs.
cfg_aliases = "0.2.2"

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile = "3"
# Room socket tests connect to the server like the native app; axum's version.
tokio-tungstenite = { workspace = true, features = ["connect"] }

[features]
default = []
# Hot reload and dioxus's tracing output, for `dx serve`; left out of release bundles.
devtools = ["dioxus/devtools", "dioxus/logger"]
web = ["dioxus/web", "dep:gloo-timers", "dep:js-sys", "dep:wasm-bindgen", "web-sys/Event", "web-sys/EventTarget", "web-sys/Request", "web-sys/RequestInit", "web-sys/Response", "web-sys/Headers", "web-sys/AbortSignal", "web-sys/MediaQueryList"]
server = [
    "dioxus/server",
    "dep:dioxus-fullstack-core",
    "dep:http",
    "dep:tokio",
    "tokio/macros",
    "tokio/rt-multi-thread",
    "dep:axum",
    "dep:tantrix-room",
    "dep:rusqlite",
    "tokio/net",
    "tokio/sync",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tower-http",
]
fullstack = ["dioxus/fullstack"]
# Server-side rendering inside a Cloudflare Worker (see `tantrix-worker`).
# The app uses browser-style timers and the SSR response status context there;
# the SSR host lives in the worker crate.
worker = ["dep:gloo-timers", "dep:dioxus-fullstack-core", "dep:http"]
desktop = ["dioxus/desktop", "dep:tokio", "tantrix-net/native", "dep:dirs", "dep:arboard", "dep:reqwest", "dep:velopack"]
bundle = []
mobile = ["dioxus/mobile", "dep:tokio"]
# Android uses the shared mobile WebView UI and native WebSocket transport.
android = ["tokio/fs", "tokio/io-util", "dep:dirs", "mobile", "tantrix-net/native", "dep:reqwest", "dep:jni", "dep:ndk-context"]
