[package]
name = "tantrix-proto"
version = "0.1.0"
edition = "2021"
description = "Wire-level message types exchanged between peers in an online Tantrix game."

[dependencies]
tantrix-game = { path = "../tantrix-game" }
enum-map = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
