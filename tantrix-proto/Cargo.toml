[package]
license = "MIT"
name = "tantrix-proto"
version = "0.1.0"
edition = "2021"
description = "Wire-level message types exchanged between peers in an online Tantrix game."

[dependencies]
tantrix-game = { path = "../tantrix-game" }
enum-map = { version = "3.1.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
