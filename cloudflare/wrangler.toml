name = "tantrix-game"
main = "src/index.js"
compatibility_date = "2026-05-12"
preview_urls = false
workers_dev = false

[[routes]]
pattern = "tantrix.louis-dispa.fr"
custom_domain = true

# The web client built by the `worker-client-build` recipe. Its index.html is
# excluded by the `.assetsignore` that recipe writes. Application routes run
# through the SSR Worker; unmatched navigations use the static 404 page.
[assets]
directory = "../target/dx/tantrix/release/web/public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = [
  "/", "/learn", "/about", "/download", "/game",
  "/online", "/online/*", "/join/*",
  "/room/*", "/api/rooms", "/api/rooms/*", "/api/online-version", "/health",
  "/robots.txt", "/sitemap.xml",
]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# The Worker logs only errors, so keep every log. Invocation logs and traces
# would record every room socket message: skip the former, sample the latter.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
persist = true
invocation_logs = false
head_sampling_rate = 1

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 0.05

[[durable_objects.bindings]]
name = "ROOM_CODES"
class_name = "RoomCodes"

[[migrations]]
tag = "v2-room-codes"
new_sqlite_classes = ["RoomCodes"]

# Per-client limits on room creation and invitation lookups, keyed by
# CF-Connecting-IP. Keep in step with `tantrix_room::rate_limit`.
[[ratelimits]]
name = "ROOM_CREATION_LIMIT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "CODE_LOOKUP_LIMIT"
namespace_id = "1002"
simple = { limit = 30, period = 60 }
