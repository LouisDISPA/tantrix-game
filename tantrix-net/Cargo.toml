[package]
name = "tantrix-net"
version = "0.1.0"
edition = "2021"
description = "matchbox_socket glue + host/client state machines for Tantrix online games."

[dependencies]
tantrix-game = { path = "../tantrix-game" }
tantrix-proto = { path = "../tantrix-proto" }
matchbox_socket = "0.14.0"
enum-map = { version = "3.1.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
futures = "0.3.34"
futures-channel = "0.3.34"
futures-timer = "3.0.4"
log = "0.4.34"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
