[package]
license = "MIT"
name = "tantrix-net"
version = "0.1.0"
edition = "2021"
description = "Browser and native WebSocket transports for server-authoritative Tantrix rooms."

[dependencies]
tantrix-game = { path = "../tantrix-game" }
tantrix-proto = { path = "../tantrix-proto" }
futures-channel = "0.3.34"
getrandom = { version = "0.4.3", features = ["wasm_js"] }

# Browsers have no `std::time::Instant`; timers must go through JS.
[target.'cfg(target_arch = "wasm32")'.dependencies]
futures = "0.3.34"
web-time = "1"
futures-timer = { version = "3.0.4", features = ["wasm-bindgen"] }
log = "0.4.34"
wasm-bindgen = "0.2.109"
web-sys = { version = "0.3.106", features = ["WebSocket", "MessageEvent", "CloseEvent", "Event"] }

[features]
native = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures", "dep:rustls", "dep:webpki-roots"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures = { version = "0.3.34", optional = true }
tokio = { version = "1.53.1", features = ["net", "time", "macros"], optional = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
tokio-tungstenite = { version = "0.28.0", features = ["native-tls"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "0.26", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
serde_json = "1.0.151"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1.53.1", features = ["rt", "macros", "test-util"] }
