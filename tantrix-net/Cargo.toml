[package]
name = "tantrix-net"
version = "0.1.0"
edition = "2021"
description = "matchbox_socket glue + host/client state machines for Tantrix online games."

[dependencies]
tantrix-game = { path = "../tantrix-game" }
tantrix-proto = { path = "../tantrix-proto" }
matchbox_socket = "0.14"
enum-map = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
futures-channel = "0.3"
futures-timer = "3"
log = "0.4"
getrandom = { version = "0.4", features = ["wasm_js"] }
uuid = { version = "1", features = ["v4", "serde"] }
