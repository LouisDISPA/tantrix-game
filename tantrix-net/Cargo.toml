[package]
license = "MIT"
name = "tantrix-net"
version = "0.1.0"
edition = "2021"
description = "Browser and native WebSocket transports for server-authoritative Tantrix rooms."

[dependencies]
tantrix-game = { path = "../tantrix-game" }
tantrix-proto = { path = "../tantrix-proto" }
futures-channel = "0.3.34"
getrandom = { version = "0.4.3", features = ["wasm_js"] }

# Browsers have no `std::time::Instant`; timers must go through JS.
[target.'cfg(target_arch = "wasm32")'.dependencies]
futures = "0.3.34"
futures-timer = { version = "3.0.4", features = ["wasm-bindgen"] }
log = "0.4.34"
wasm-bindgen = "0.2.109"
web-sys = { version = "0.3.106", features = ["WebSocket", "MessageEvent", "CloseEvent", "Event"] }

[features]
native = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures = { version = "0.3.34", optional = true }
tokio = { version = "1.53.1", features = ["net", "time", "macros"], optional = true }
tokio-tungstenite = { version = "0.28.0", features = ["native-tls"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "macros", "test-util"] }
