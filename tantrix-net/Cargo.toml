[package]
name = "tantrix-net"
version = "0.1.0"
description = "Browser and native WebSocket transports for server-authoritative Tantrix rooms."
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
tantrix-game.workspace = true
tantrix-proto.workspace = true
futures-channel.workspace = true
# Not used in code: lets `rand` (through tantrix-game) build for wasm32.
getrandom = { workspace = true, features = ["wasm_js"] }

# Browsers have no `std::time::Instant`; timers must go through JS.
[target.'cfg(target_arch = "wasm32")'.dependencies]
futures.workspace = true
web-time.workspace = true
futures-timer = { version = "3.0.4", features = ["wasm-bindgen"] }
log.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["WebSocket", "MessageEvent", "CloseEvent", "Event"] }

[features]
native = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures", "dep:rustls", "dep:webpki-roots"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures = { workspace = true, optional = true }
tokio = { workspace = true, features = ["net", "time", "macros"], optional = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
tokio-tungstenite = { workspace = true, default-features = true, features = ["native-tls"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
tokio-tungstenite = { workspace = true, default-features = true, features = ["rustls-tls-webpki-roots"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
reqwest = { workspace = true, features = ["native-tls"] }
serde_json.workspace = true
uuid = { workspace = true, features = ["v4"] }
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }

[package.metadata.cargo-shear]
ignored = ["getrandom"]
