[package]
license = "MIT"
name = "tantrix-worker"
version = "0.1.0"
edition = "2021"
publish = false
description = "Cloudflare Worker that server-renders the Tantrix app for client hydration"

[lib]
crate-type = ["cdylib"]

[dependencies]
# The Worker crate is intentionally empty on native targets, so its runtime
# and app dependencies belong only to the wasm32 build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
tantrix-app = { path = "../tantrix-app", features = ["worker"] }
tantrix-game = { path = "../tantrix-game" }
tantrix-proto = { path = "../tantrix-proto" }
tantrix-room = { path = "../tantrix-room" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
futures = "0.3.31"
uuid = { version = "1", features = ["v4", "js"] }
# Patched for wasm32 via `[patch.crates-io]` (vendor/dioxus-server). Used
# directly rather than through `dioxus/server`, whose re-exports (`serve`,
# `launch`) only exist on native targets.
dioxus-server = "0.7.10"
worker = { version = "0.8.7", features = ["http"] }
wasm-bindgen = "0.2.129"
axum = { version = "0.8.9", default-features = false }
tower-service = "0.3.3"
console_error_panic_hook = "0.1.7"
