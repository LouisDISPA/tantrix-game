[package]
name = "tantrix-worker"
version = "0.1.0"
publish = false
description = "Cloudflare Worker that server-renders the Tantrix app for client hydration"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
# The Worker crate is intentionally empty on native targets, so its runtime
# and app dependencies belong only to the wasm32 build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
tantrix-app = { path = "../tantrix-app", features = ["worker"] }
tantrix-proto.workspace = true
tantrix-room.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
futures.workspace = true
# Patched for wasm32 via `[patch.crates-io]` (vendor/dioxus-server). Used
# directly rather than through `dioxus/server`, whose re-exports (`serve`,
# `launch`) only exist on native targets.
dioxus-server = "=0.8.0-alpha.3"
worker = { version = "0.8.7", features = ["http"] }
# Not named in code: `#[event]` and `#[durable_object]` expand to `wasm_bindgen` paths.
wasm-bindgen.workspace = true
axum.workspace = true
tower-service = "0.3.3"
console_error_panic_hook = "0.1.7"

[package.metadata.cargo-shear]
ignored = ["wasm-bindgen"]
